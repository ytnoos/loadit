[versions]
mavenSettings = "0.5"
shadow = "9.3.1"
spigot = "1.8.8-R0.1-SNAPSHOT"
jspecify = "1.0.0"
junit = "5.13.4"

[libraries]
mavenSettings = { module = "net.linguica.maven-settings:net.linguica.maven-settings.gradle.plugin", version.ref = "mavenSettings" }
shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spigot = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
gradle_plugins = ["mavenSettings", "shadow"]